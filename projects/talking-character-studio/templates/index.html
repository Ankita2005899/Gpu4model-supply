<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Talking Character Studio</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    .field { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    .hint { color: #666; font-size: 0.9rem; margin-top: 2px; }
    button { padding: 10px 18px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Step 1 — Upload the base image</h1>
  <p>Upload the full scene (background, all characters). We'll detect the faces in it
     next, so you can pick which one gets replaced + animated.</p>

  <form action="/detect" method="post" enctype="multipart/form-data">
    <div class="field">
      <label for="base_image">Base image</label>
      <input type="file" id="base_image" name="base_image" accept="image/*" required>
    </div>
    <button type="submit">Detect faces &rarr;</button>
  </form>
</body>
</html>
